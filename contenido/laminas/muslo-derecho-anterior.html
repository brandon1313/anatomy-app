<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muslo derecho, vista anterior</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Spectral:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8edeb; --plate:#d6dfdc; --plate-edge:#c2cdca; --ink:#1b2428; --muted:#56656b;
  --line:#bccac6; --chip:#f3f6f5; --chip-ink:#1b2428; --sel:#077a80; --sel-soft:#077a8022;
  --bad:#a86a0c; --bad-soft:#a86a0c1f; --label:#1b2428;
  --serif:"Spectral", Georgia, "Times New Roman", serif;
  --sans:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15191b; --plate:#1d2427; --plate-edge:#2a3337; --ink:#e2e9e7; --muted:#97a6aa;
    --line:#334044; --chip:#222a2d; --chip-ink:#e2e9e7; --sel:#4cd3c8; --sel-soft:#4cd3c826;
    --bad:#e8a948; --bad-soft:#e8a94826; --label:#e2e9e7; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15191b; --plate:#1d2427; --plate-edge:#2a3337; --ink:#e2e9e7; --muted:#97a6aa;
  --line:#334044; --chip:#222a2d; --chip-ink:#e2e9e7; --sel:#4cd3c8; --sel-soft:#4cd3c826;
  --bad:#e8a948; --bad-soft:#e8a94826; --label:#e2e9e7; color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 28px;padding:22px clamp(16px,3vw,36px) 14px}
.top h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.6rem,3.2vw,2.3rem);line-height:1.1;margin:0;letter-spacing:-.01em}
.top p{margin:4px 0 0;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--chip)}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible,.chip:focus-visible,.btn:focus-visible,.check input:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink);min-height:36px}
.check input{width:18px;height:18px;accent-color:var(--sel);margin:0}
.check[aria-disabled="true"]{opacity:.45;pointer-events:none}

.layout{display:grid;grid-template-columns:minmax(340px,600px) minmax(0,1fr);gap:0;align-items:start;padding:0 clamp(16px,3vw,36px) 32px;column-gap:clamp(20px,3vw,40px)}
.plate{background:var(--plate);border:1px solid var(--plate-edge);border-radius:20px;position:sticky;top:12px;overflow:clip}
.bar{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 18px;border-bottom:1px solid var(--plate-edge);background:var(--plate);border-radius:20px 20px 0 0}
.bar a.btn{text-decoration:none}
.bar .msg{flex:1;min-width:0}
.bar .big{font-family:var(--serif);font-size:1.45rem;line-height:1.2;font-weight:500}
.bar .hint{color:var(--muted)}
.bar .ok{color:var(--sel)}
.bar .badtxt{color:var(--bad)}
.bar .jump{display:none}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 16px;cursor:pointer;min-height:38px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.figwrap{position:relative;padding:6px 8px 0}
#fig{display:block;width:100%;height:max(520px,calc(100vh - 250px));max-height:940px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.orient{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;padding:2px 18px 12px}
.caption{color:var(--muted);font-size:.85rem;text-align:center;padding:0 18px 14px;margin:-6px 0 0}

/* drawing */
.sil{fill:#5a222d}
.knee{fill:#e2d1c1;stroke:#c7b19e;stroke-width:1}
.gen{fill:none;stroke:#b8323c;stroke-width:1.1;opacity:.75}
.tendon{fill:#ebe1d1;stroke:#b6a48c;stroke-width:.8}
.hi{fill:#f3a3a8;opacity:.42;filter:url(#soft)}
.fib{fill:none;stroke:#6f1d2a;stroke-width:.7;opacity:.5}
.apo{fill:none;stroke:#f2dcd6;stroke-width:2.2;opacity:.7}
.edge{fill:none;stroke:#5a1622;stroke-width:1;transition:stroke .2s,stroke-width .2s}
.muscle{filter:url(#drop)}
.fascia-body{fill:#e8dfd2;opacity:.82}
.fasc-fib{fill:none;stroke:#c7b8a2;stroke-width:.7;opacity:.8}
.fascia .edge{stroke:#b9a891;stroke-width:.8}
.hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke}
.v-out,.v-in,.v-sheen,.n-out,.n-in,.lig-out,.lig-in{fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.artery .v-out{stroke:#6e0f17}.artery .v-in{stroke:#d0343c}.artery .v-sheen{stroke:#f08a8a;opacity:.7}
.vein .v-out{stroke:#1d3c6b}.vein .v-in{stroke:#4f7fc4}.vein .v-sheen{stroke:#a8c4ef;opacity:.6}
.n-out{stroke:#8c7424}.n-in{stroke:#ecd57e}
.patella{fill:#efe4d2;stroke:#b9a68d;stroke-width:1.2;transition:stroke .2s}
.patella-hi{fill:#fff8ee;opacity:.6;filter:url(#soft)}
.lig-out{stroke:#b9a891;stroke-width:6}.lig-in{stroke:#f1e9dc;stroke-width:4}

.part{cursor:pointer;transition:opacity .3s}
.part:focus{outline:none}
.part.off{opacity:0 !important;pointer-events:none}
#art{transition:opacity .25s}
#fig.has-sel #art{opacity:.32}
#focus{pointer-events:none}
@media (hover:hover){.part:hover .body,.part:hover .patella{filter:brightness(1.1)}.part:hover .v-in,.part:hover .n-in{filter:brightness(1.15)}}
.part:focus-visible .edge{stroke:var(--sel);stroke-width:2.4}

.part.sel .edge{stroke:var(--sel);stroke-width:2.6}
.part.sel .v-out,.part.sel .n-out,.part.sel .lig-out{stroke:var(--sel)}
.part.sel .patella{stroke:var(--sel);stroke-width:2.6}
.part.flash-ok .edge,.part.flash-ok .v-out,.part.flash-ok .n-out,.part.flash-ok .lig-out{stroke:var(--sel);stroke-width:3}
.part.flash-ok .patella{stroke:var(--sel);stroke-width:3}
.part.flash-bad .edge,.part.flash-bad .v-out,.part.flash-bad .n-out,.part.flash-bad .lig-out{stroke:var(--bad);stroke-width:3}
.part.flash-bad .patella{stroke:var(--bad);stroke-width:3}

#ghost path{fill:none;stroke:var(--sel);stroke-width:1.7;stroke-dasharray:5 4;stroke-linecap:round;pointer-events:none}
#ghost.hint path{animation:pulse 1.2s ease-in-out infinite;stroke-width:2.4}
@keyframes pulse{50%{opacity:.25}}

#labels{font-family:var(--sans);font-size:16.5px}
#labels text{fill:var(--label);cursor:pointer}
#labels line{stroke:var(--label);stroke-width:.8;opacity:.55}
#labels circle{fill:var(--label)}
#labels g.on text{fill:var(--sel);font-weight:700}
#labels g.on line{stroke:var(--sel);opacity:1}
#labels g.on circle{fill:var(--sel)}

/* panel */
.panel{padding-top:4px;max-width:640px}
.quiz{border-bottom:1px solid var(--line);padding:4px 0 18px;margin-bottom:18px}
.quiz h2,.index h2{font-family:var(--serif);font-weight:500;font-size:1.2rem;margin:0 0 6px}
.score{font-size:1.05rem;margin:0 0 12px}
.score strong{font-variant-numeric:tabular-nums}
.quiz .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.info .empty{color:var(--muted);margin:6px 0 0;max-width:36ch}
.info h2{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,3vw,2.4rem);line-height:1.05;margin:0;letter-spacing:-.015em}
.info .latin{font-family:var(--serif);font-style:italic;color:var(--muted);margin:4px 0 0;font-size:1.05rem}
.info .grp{display:inline-block;margin:12px 0 4px;padding:3px 12px;border-radius:999px;background:var(--sel-soft);color:var(--ink);font-size:.9rem}
.info dl{margin:14px 0 0;display:grid;grid-template-columns:7.2rem 1fr;gap:10px 14px}
.info dt{color:var(--muted);font-size:.92rem;padding-top:1px}
.info dd{margin:0;max-width:60ch}
.info .note{color:var(--muted);font-size:.88rem;margin:16px 0 0;display:flex;gap:8px;align-items:center}
.info .note svg{flex:none}
.index{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.index h3{font-size:.95rem;font-weight:700;color:var(--muted);margin:14px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:6px 13px;cursor:pointer;min-height:36px;font-size:.95rem}
.chip.deep{border-style:dashed}
.chip[aria-current="true"]{border-color:var(--sel);background:var(--sel-soft);font-weight:700}
.chip small{color:var(--muted);font-size:.8rem;margin-left:4px}

@media (max-width: 900px){
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  .layout{grid-template-columns:1fr;row-gap:22px}
  .plate{position:relative;top:0}
  .bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-radius:0}
  #fig{height:min(74vh,760px)}
  .bar .jump{display:inline-flex}
  .bar .big{font-size:1.3rem}
  .top{align-items:flex-start}
}
@media (max-width: 480px){
  .top{padding-top:16px;gap:10px}
  .top h1{font-size:1.45rem}
  .top p{display:none}
  .controls{gap:8px}
  .seg button{padding:5px 10px;font-size:.92rem;min-height:34px}
  .info dl{grid-template-columns:1fr;gap:2px}
  .info dd{margin-bottom:10px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>Muslo derecho, vista anterior</h1>
    <p id="sub">Toca un músculo para ver su nombre y su ficha.</p>
  </div>
  <div class="controls">
    <div class="seg" role="group" aria-label="Modo">
      <button type="button" data-mode="explore" aria-pressed="true">Explorar</button>
      <button type="button" data-mode="quiz" aria-pressed="false">Reto</button>
    </div>
    <div class="seg" role="group" aria-label="Capa">
      <button type="button" data-layer="superficial" aria-pressed="true">Superficial</button>
      <button type="button" data-layer="profunda" aria-pressed="false">Profunda</button>
    </div>
    <label class="check" id="labelsWrap"><input type="checkbox" id="labelsToggle"> Mostrar nombres</label>
  </div>
</header>

ofemoral."]], "short": "Vasto medial"}, "vasto_intermedio": {"name": "Vasto intermedio", "art": "el", "latin": "Musculus vastus intermedius", "kind": "muscle", "group": "Cuádriceps, compartimento anterior", "rows": [["Origen", "Caras anterior y lateral de los dos tercios superiores de la diáfisis del fémur."], ["Inserción", "Cara profunda del tendón del cuádriceps, rótula y tuberosidad tibial."], ["Inervación", "Nervio femoral (L2–L4)."], ["Acción", "Extiende la rodilla."], ["Dato clave", "Queda oculto bajo el recto femoral, por eso solo aparece en la capa profunda."]], "short": "Vasto intermedio"}, "sartorio": {"name": "Sartorio", "art": "el", "latin": "Musculus sartorius", "kind": "muscle", "group": "Compartimento anterior", "rows": [["Origen", "Espina ilíaca anterosuperior."], ["Inserción", "Cara medial de la parte superior de la tibia, en la pata de ganso."], ["Inervación", "Nervio femoral (L2–L3)."], ["Acción", "Flexiona, abduce y rota lateralmente la cadera; flexiona la rodilla."], ["Dato clave", "Es el músculo más largo del cuerpo. Limita por fuera el triángulo femoral y cubre el conducto aductor, donde corren los vasos femorales."]], "short": "Sartorio"}, "tensor_fascia_lata": {"name": "Tensor de la fascia lata", "short": "Tensor fascia lata", "art": "el", "latin": "Musculus tensor fasciae latae", "kind": "muscle", "group": "Región glútea, plano superficial", "rows": [["Origen", "Espina ilíaca anterosuperior y parte anterior de la cresta ilíaca."], ["Inserción", "Tracto iliotibial, que llega al tubérculo de Gerdy en el cóndilo lateral de la tibia."], ["Inervación", "Nervio glúteo superior (L4–S1)."], ["Acción", "Flexiona, abduce y rota medialmente la cadera; tensa el tracto iliotibial y estabiliza la rodilla en extensión."], ["Dato clave", "Aunque se ve en la cara anterior, funcionalmente pertenece al grupo glúteo."]]}, "iliopsoas": {"name": "Iliopsoas", "art": "el", "latin": "Musculus iliopsoas", "kind": "muscle", "group": "Flexores de la cadera", "rows": [["Origen", "Psoas mayor: cuerpos y apófisis transversas de T12 a L5. Ilíaco: fosa ilíaca."], ["Inserción", "Trocánter menor del fémur."], ["Inervación", "Psoas: ramos anteriores de L1–L3. Ilíaco: nervio femoral (L2–L3)."], ["Acción", "Es el flexor más potente de la cadera; también flexiona el tronco sobre el muslo."], ["Dato clave", "Pasa bajo el ligamento inguinal y forma la parte lateral del piso del triángulo femoral."]], "short": "Iliopsoas"}, "pectineo": {"name": "Pectíneo", "art": "el", "latin": "Musculus pectineus", "kind": "muscle", "group": "Compartimento medial", "rows": [["Origen", "Línea pectínea del pubis."], ["Inserción", "Línea pectínea del fémur, debajo del trocánter menor."], ["Inervación", "Nervio femoral (L2–L3); a veces también un ramo del obturador."], ["Acción", "Aduce y flexiona la cadera."], ["Dato clave", "Músculo de transición: está en el compartimento medial pero suele inervarlo el nervio femoral. Forma parte del piso del triángulo femoral."]], "short": "Pectíneo"}, "aductor_largo": {"name": "Aductor largo", "art": "el", "latin": "Musculus adductor longus", "kind": "muscle", "group": "Aductores, compartimento medial", "rows": [["Origen", "Cuerpo del pubis, debajo de la cresta púbica."], ["Inserción", "Tercio medio de la línea áspera."], ["Inervación", "Nervio obturador, división anterior (L2–L4)."], ["Acción", "Aduce la cadera y ayuda a flexionarla."], ["Dato clave", "Su borde medial limita por dentro el triángulo femoral. Es el aductor que más se lesiona en la pubalgia del deportista."]], "short": "Aductor largo"}, "aductor_corto": {"name": "Aductor corto", "art": "el", "latin": "Musculus adductor brevis", "kind": "muscle", "group": "Aductores, compartimento medial", "rows": [["Origen", "Cuerpo y rama inferior del pubis."], ["Inserción", "Línea pectínea y parte superior de la línea áspera."], ["Inervación", "Nervio obturador (L2–L4)."], ["Acción", "Aduce la cadera y ayuda a flexionarla."], ["Dato clave", "Queda detrás del pectíneo y del aductor largo. Las divisiones anterior y posterior del nervio obturador pasan por delante y por detrás de él."]], "short": "Aductor corto"}, "aductor_mayor": {"name": "Aductor mayor", "art": "el", "latin": "Musculus adductor magnus", "kind": "muscle", "group": "Aductores, compartimento medial", "rows": [["Origen", "Porción aductora: rama inferior del pubis y rama del isquion. Porción isquiotibial: tuberosidad isquiática."], ["Inserción", "Porción aductora: tuberosidad glútea, línea áspera y línea supracondílea medial. Porción isquiotibial: tubérculo aductor del fémur."], ["Inervación", "Porción aductora: nervio obturador (L2–L4). Porción isquiotibial: división tibial del nervio ciático (L4)."], ["Acción", "Aduce la cadera; la porción aductora la flexiona y la isquiotibial la extiende."], ["Dato clave", "Entre sus dos inserciones queda el hiato aductor, por donde los vasos femorales pasan a la fosa poplítea."]], "short": "Aductor mayor"}, "gracil": {"name": "Grácil", "art": "el", "latin": "Musculus gracilis", "kind": "muscle", "group": "Aductores, compartimento medial", "rows": [["Origen", "Cuerpo y rama inferior del pubis."], ["Inserción", "Cara medial de la parte superior de la tibia, en la pata de ganso."], ["Inervación", "Nervio obturador (L2–L3)."], ["Acción", "Aduce la cadera, flexiona la rodilla y rota medialmente la pierna."], ["Dato clave", "Es el aductor más superficial y el único que cruza la rodilla. Su tendón se usa como injerto para reconstruir el ligamento cruzado anterior."]], "short": "Grácil"}, "tracto_iliotibial": {"name": "Tracto iliotibial", "art": "el", "latin": "Tractus iliotibialis", "kind": "struct", "group": "Fascia profunda del muslo", "rows": [["Qué es", "Engrosamiento lateral de la fascia lata."], ["Recorrido", "Del tubérculo de la cresta ilíaca al tubérculo de Gerdy en la tibia. Recibe al tensor de la fascia lata y a parte del glúteo mayor."], ["Función", "Estabiliza la cadera y la cara lateral de la rodilla."], ["Clínica", "Su roce sobre el epicóndilo lateral del fémur causa el síndrome de la cintilla iliotibial, frecuente en corredores."]], "short": "Tracto iliotibial"}, "arteria_femoral": {"name": "Arteria femoral", "short": "A. femoral", "art": "la", "latin": "Arteria femoralis", "kind": "struct", "group": "Vasos del muslo", "rows": [["Qué es", "Continuación de la arteria ilíaca externa al pasar bajo el ligamento inguinal."], ["Recorrido", "Baja por el triángulo femoral y sigue por el conducto aductor, bajo el sartorio. Al cruzar el hiato aductor pasa a llamarse arteria poplítea. Su rama principal es la femoral profunda."], ["Relaciones", "En el triángulo femoral queda entre el nervio femoral, por fuera, y la vena femoral, por dentro."], ["Clínica", "Su pulso se palpa en el punto medio inguinal. Es la vía de acceso habitual para cateterismos."]]}, "vena_femoral": {"name": "Vena femoral", "short": "V. femoral", "art": "la", "latin": "Vena femoralis", "kind": "struct", "group": "Vasos del muslo", "rows": [["Qué es", "Continuación de la vena poplítea. Bajo el ligamento inguinal se convierte en vena ilíaca externa."], ["Recorrido", "Acompaña a la arteria femoral; en el triángulo femoral está medial a ella. Recibe a la vena safena mayor cerca del ligamento inguinal."], ["Clínica", "Sitio de acceso venoso central y localización frecuente de trombosis venosa profunda."]]}, "nervio_femoral": {"name": "Nervio femoral", "short": "N. femoral", "art": "el", "latin": "Nervus femoralis", "kind": "struct", "group": "Nervios del muslo", "rows": [["Qué es", "La rama más grande del plexo lumbar (L2–L4)."], ["Recorrido", "Entra al muslo bajo el ligamento inguinal, por fuera de la arteria y fuera de la vaina femoral, y se abre en abanico en ramas musculares y cutáneas."], ["Inerva", "Cuádriceps, sartorio, pectíneo e ilíaco. Su rama, el nervio safeno, da sensibilidad a la cara medial de la pierna."], ["Regla útil", "En el triángulo femoral, de lateral a medial: nervio, arteria, vena y conducto femoral."]]}, "ligamento_inguinal": {"name": "Ligamento inguinal", "short": "Lig. inguinal", "art": "el", "latin": "Ligamentum inguinale", "kind": "struct", "group": "Límite del triángulo femoral", "rows": [["Qué es", "Borde inferior engrosado de la aponeurosis del músculo oblicuo externo."], ["Recorrido", "De la espina ilíaca anterosuperior al tubérculo púbico."], ["Relaciones", "Es el límite superior del triángulo femoral. Por debajo pasan el iliopsoas, el nervio femoral y los vasos femorales."], ["Clínica", "Sirve de referencia para distinguir hernias inguinales, por encima, de hernias femorales, por debajo."]]}, "rotula": {"name": "Rótula", "art": "la", "latin": "Patella", "kind": "struct", "group": "Hueso de la rodilla", "rows": [["Qué es", "El hueso sesamoideo más grande del cuerpo, dentro del tendón del cuádriceps."], ["Uniones", "Arriba recibe el tendón del cuádriceps; abajo, el ligamento rotuliano la une a la tuberosidad de la tibia."], ["Función", "Aumenta la palanca del cuádriceps y protege la parte anterior de la rodilla."]], "short": "Rótula"}}, "groups": [["Cuádriceps", ["recto_femoral", "vasto_lateral", "vasto_medial", "vasto_intermedio"]], ["Aductores", ["pectineo", "aductor_largo", "aductor_corto", "aductor_mayor", "gracil"]], ["Otros músculos", ["sartorio", "tensor_fascia_lata", "iliopsoas"]], ["Vasos, nervio y otras estructuras", ["arteria_femoral", "vena_femoral", "nervio_femoral", "ligamento_inguinal", "tracto_iliotibial", "rotula"]]], "anchors": {"superficial": {"ligamento_inguinal": [140, 74, "L"], "nervio_femoral": [194, 112, "L"], "tensor_fascia_lata": [92, 135, "L"], "iliopsoas": [178, 172, "L"], "tracto_iliotibial": [80, 330, "L"], "recto_femoral": [160, 400, "L"], "vasto_lateral": [126, 600, "L"], "rotula": [200, 800, "L"], "pectineo": [256, 150, "R"], "aductor_largo": [280, 225, "R"], "arteria_femoral": [234, 252, "R"], "vena_femoral": [252, 274, "R"], "aductor_mayor": [297, 340, "R"], "sartorio": [262, 440, "R"], "gracil": [317, 520, "R"], "vasto_medial": [2 const shuffle = a => { for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

parts.forEach(p => {
  p.setAttribute("tabindex", "0");
  p.setAttribute("role", "button");
  p.addEventListener("click", e => { e.stopPropagation(); tap(p.dataset.id); });
  p.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tap(p.dataset.id); } });
});
fig.addEventListener("click", () => { if (st.mode === "explore") select(null); });

function setAria(){
  parts.forEach(p => p.setAttribute("aria-label", st.mode === "quiz" ? "Estructura del muslo" : D[p.dataset.id].name));
}

/* ---------- selection ---------- */
parts.forEach(p => { p.id = "p-" + p.dataset.id; });
function overlaps(a, b){ return a.x < b.x + b.width && b.x < a.x + a.width && a.y < b.y + b.height && b.y < a.y + a.height; }
function maskShape(id){
  const el = byId[id], d = P.ghosts[id];
  if (el.classList.contains("muscle") || el.classList.contains("fascia") || id === "rotula")
    return `<path d="${d}" fill="#fff"/>`;
  const w = el.classList.contains("vein") ? 15 : el.classList.contains("artery") ? 12 : 8;
  return `<path d="${d}" fill="none" stroke="#fff" stroke-width="${w}" stroke-linecap="round"/>`;
}
function focusOn(id){
  const f = $("focus"); f.innerHTML = "";
  fig.classList.toggle("has-sel", !!id);
  if (!id) return;
  const el = byId[id], bb = el.getBBox();
  const later = parts.slice(parts.indexOf(el) + 1)
    .filter(p => !p.classList.contains("off") && overlaps(bb, p.getBBox()));
  $("focusMask").innerHTML = maskShape(id);
  f.innerHTML = `<use href="#p-${id}"/>` +
    `<g mask="url(#focusMask)">${later.map(p => `<use href="#${p.id}" opacity=".72"/>`).join("")}</g>`;
}
function select(id){
  st.sel = id;
  parts.forEach(p => p.classList.toggle("sel", p.dataset.id === id));
  focusOn(id);
  drawGhost(id, false);
  renderInfo(); renderBar(); renderIndex(); markLabels();
}
function drawGhost(id, hint){
  const g = $("ghost"); g.innerHTML = ""; g.classList.toggle("hint", !!hint);
  if (!id) return;
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", P.ghosts[id]); g.appendChild(p);
}
function flash(id, kind){
  const el = byId[id]; const c = "flash-" + kind;
  el.classList.remove("flash-ok","flash-bad"); void el.getBBox(); el.classList.add(c);
  setTimeout(() => el.classList.remove(c), 1100);
}

/* ---------- taps ---------- */
function tap(id){
  if (st.mode === "explore") { select(st.sel === id ? null : id); return; }
  const q = st.quiz; if (!q || q.done) return;
  const target = q.queue[q.i];
  if (q.answered) return;
  if (id === target) {
    q.answered = true; if (q.tries === 0) q.first++;
    flash(id, "ok"); drawGhost(null);
    st.sel = id; parts.forEach(p => p.classList.toggle("sel", p.dataset.id === id)); focusOn(id);
    q.msg = {kind:"ok"};
  } else {
    q.tries++; flash(id, "bad");
    q.msg = {kind:"bad", wrong:id};
    if (q.tries >= 2) { drawGhost(target, true); q.msg.hint = true; }
  }
  renderBar(); renderInfo(); renderScore();
}

/* ---------- quiz ---------- */
function startQuiz(){
  const incl = $("inclStruct").checked;
  const pool = parts.map(p => p.dataset.id).filter(id => visible(id) && (incl || D[id].kind === "muscle"));
  st.quiz = {queue:shuffle(pool), i:0, first:0, tries:0, answered:false, done:false, msg:null};
  st.sel = null; parts.forEach(p => p.classList.remove("sel")); drawGhost(null); focusOn(null);
  renderBar(); renderInfo(); renderScore();
}
function nextQ(skipped){
  const q = st.quiz; if (!q) return;
  q.i++; q.tries = 0; q.answered = false; q.msg = skipped ? {kind:"skip", prev:q.queue[q.i-1]} : null;
  st.sel = null; parts.forEach(p => p.classList.remove("sel")); drawGhost(null); focusOn(null);
  if (q.i >= q.queue.length) q.done = true;
  renderBar(); renderInfo(); renderScore();
  const nb = $("nextBtn"); if (nb) nb.focus();
}
function renderScore(){
  const q = st.quiz; if (!q) return;
  const answered = Math.min(q.i + (q.answered ? 1 : 0), q.queue.length);
  $("score").innerHTML = `Aciertos a la primera: <strong>${q.first} de ${answered}</strong>. Quedan ${q.queue.length - answered} de ${q.queue.length}.`;
  $("skip").disabled = q.done || q.answered;
}

/* ---------- bar ---------- */
function renderBar(){
  const bar = $("bar");
  if (st.mode === "explore") {
    if (!st.sel) { bar.innerHTML = `<div class="msg hint">Toca un músculo o elige uno de la lista.</div>`; return; }
    bar.innerHTML = `<div class="msg big">${esc(D[st.sel].name)}</div><a class="btn ghost jump" href="#info">Ver ficha</a>`;
    return;
  }
  const q = st.quiz;
  if (q.done) {
    bar.innerHTML = `<div class="msg"><div class="big">Terminaste: ${q.first} de ${q.queue.length} a la primera.</div></div><button class="btn" id="againBtn" type="button">Empezar de nuevo</button>`;
    $("againBtn").onclick = startQuiz; return;
  }
  const target = q.queue[q.i];
  const m = q.msg;
  if (q.answered) {
    bar.innerHTML = `<div class="msg"><div class="big ok">Correcto, es ${esc(low(target))}.</div></div><a class="btn ghost jump" href="#info">Ver ficha</a><button class="btn" id="nextBtn" type="button">Siguiente</button>`;
    $("nextBtn").onclick = () => nextQ(false); $("nextBtn").focus(); return;
  }
  let sub = "";
  if (m && m.kind === "bad") sub = `<div class="badtxt">Eso es ${esc(low(m.wrong))}.${m.hint ? " Pista: está marcado con línea punteada." : " Prueba otra vez."}</div>`;
  if (m && m.kind === "skip") sub = `<div class="hint">La anterior era ${esc(low(m.prev))}.</div>`;
  bar.innerHTML = `<div class="msg"><div class="big">Toca ${esc(low(target))}</div>${sub}</div>`;
}

/* ---------- info panel ---------- */
const dashIcon = `<svg width="26" height="8" aria-hidden="true"><line x1="1" y1="4" x2="25" y2="4" stroke="currentColor" stroke-width="1.8" stroke-dasharray="5 4"/></svg>`;
function renderInfo(){
  const el = $("info");
  const id = st.sel;
  if (!id) {
    el.innerHTML = st.mode === "explore"
      ? `<p class="empty">Selecciona una estructura en el dibujo para ver su origen, inserción, inervación y acción.</p>`
      : `<p class="empty">Cuando aciertes, aquí aparece la ficha del músculo.</p>`;
    return;
  }
  const d = D[id];
  el.innerHTML = `<h2>${esc(d.name)}</h2><p class="latin">${esc(d.latin)}</p><span class="grp">${esc(d.group)}</span>
    <dl>${d.rows.map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    ${st.mode === "explore" ? `<p class="note">${dashIcon}<span>La línea punteada marca el contorno completo, incluida la parte cubierta por otras estructuras.</span></p>` : ""}`;
}

/* ---------- index ---------- */
function renderIndex(){
  const el = $("index");
  if (st.mode !== "explore") { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<h2>Todas las estructuras</h2>` + P.groups.map(([g, ids]) =>
    `<h3>${esc(g)}</h3><div class="chips">${ids.map(id => {
      const deep = !visible(id);
      return `<button type="button" class="chip${deep ? " deep" : ""}" data-id="${id}" aria-current="${st.sel === id}">${esc(D[id].name)}${deep ? `<small>${st.layer === "superficial" ? "profunda" : "superficial"}</small>` : ""}</button>`;
    }).join("")}</div>`).join("");
  el.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    const id = b.dataset.id;
    if (!visible(id)) setLayer(st.layer === "superficial" ? "profunda" : "superficial");
    select(id);
    if (window.matchMedia("(max-width: 900px)").matches) $("bar").scrollIntoView({behavior:"smooth", block:"start"});
  });
}

/* ---------- labels ---------- */
function renderLabels(){
  const g = $("labels"); g.innerHTML = "";
  const on = st.labels && st.mode === "explore";
  fig.setAttribute("viewBox", on ? VB.labels : VB.plain);
  if (!on) return;
  const A = P.anchors[st.layer];
  ["L","R"].forEach(side => {
    const items = Object.entries(A).filter(([id,a]) => a[2] === side && visible(id)).sort((a,b) => a[1][1] - b[1][1]);
    let prev = -1e9;
    items.forEach(it => { it.ly = Math.max(it[1][1], prev + 23); prev = it.ly; });
    const over = prev - 918; if (over > 0) items.forEach(it => it.ly -= over);
    items.forEach(it => {
      const [id, [ax, ay]] = it;
      const tx = side === "L" ? 40 : 360, lx = side === "L" ? 45 : 355;
      const grp = document.createElementNS(NS, "g"); grp.dataset.id = id;
      grp.innerHTML = `<line x1="${lx}" y1="${it.ly}" x2="${ax}" y2="${ay}"/><circle cx="${ax}" cy="${ay}" r="2"/>` +
        `<text x="${tx}" y="${it.ly}" dy="4" text-anchor="${side === "L" ? "end" : "start"}">${esc(D[id].short)}</text>`;
      grp.querySelector("text").addEventListener("click", e => { e.stopPropagation(); select(st.sel === id ? null : id); });
      g.appendChild(grp);
    });
  });
  markLabels();
}
function markLabels(){ $("labels").querySelectorAll("g").forEach(g => g.classList.toggle("on", g.dataset.id === st.sel)); }

/* ---------- mode / layer ---------- */
function setLayer(layer){
  st.layer = layer;
  document.querySelectorAll("[data-layer]").forEach(b => b.setAttribute("aria-pressed", b.dataset.layer === layer));
  parts.forEach(p => {
    const off = !visible(p.dataset.id);
    p.classList.toggle("off", off);
    if (off) p.setAttribute("tabindex", "-1"); else p.setAttribute("tabindex", "0");
  });
  $("caption").textContent = layer === "superficial"
    ? "Capa superficial: músculos, vasos y nervio tal como se ven al retirar la piel y la fascia."
    : "Capa profunda: se retiraron el sartorio, el recto femoral y el aductor largo.";
  if (st.sel && !visible(st.sel)) st.sel = null;
  renderLabels();
  if (st.mode === "quiz") startQuiz(); else select(st.sel);
}
function setMode(mode){
  st.mode = mode;
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
  $("quiz").hidden = mode !== "quiz";
  $("labelsWrap").setAttribute("aria-disabled", mode === "quiz");
  $("sub").textContent = mode === "quiz" ? "Busca en el dibujo la estructura que se pide." : "Toca un músculo para ver su nombre y su ficha.";
  setAria();
  renderLabels();
  if (mode === "quiz") { startQuiz(); }
  else { st.quiz = null; select(null); }
  renderIndex();
}

document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.querySelectorAll("[data-layer]").forEach(b => b.onclick = () => setLayer(b.dataset.layer));
$("labelsToggle").onchange = e => { st.labels = e.target.checked; renderLabels(); };
$("skip").onclick = () => nextQ(true);
$("restart").onclick = startQuiz;
$("inclStruct").onchange = startQuiz;

setAria();
setLayer("superficial");
setMode("explore");
</script>
</body>
</html>
